<!doctype html>
<html lang="ru"><head><style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#fff);--ink:var(--tg-theme-text-color,#18202d);--muted:var(--tg-theme-hint-color,#788391);--soft:var(--tg-theme-secondary-bg-color,#f2f4f8);--accent:var(--tg-theme-button-color,#635bdf);--on:var(--tg-theme-button-text-color,#fff);--line:var(--tg-theme-section-separator-color,#e4e7ec);--bad:var(--tg-theme-destructive-text-color,#cc4758)}
*{box-sizing:border-box}body{margin:0;padding:14px 12px 10px;background:var(--bg);color:var(--ink);font:13px/1.35 system-ui,sans-serif}button{font:inherit;border:0;border-radius:10px;padding:11px 9px;background:var(--soft);color:var(--ink);cursor:pointer}button:active{opacity:.7}button:disabled{opacity:.45}header,.row,.grid,nav,.foot,.pager{display:flex;align-items:center;gap:8px}header{margin-bottom:16px}.mark{padding:5px 10px;border-radius:10px;background:var(--accent);color:var(--on);font-size:19px;font-weight:700}.brand{flex:1;font-size:11px;font-weight:700}.pill{font-size:9px;white-space:nowrap;color:var(--muted)}h1{font-size:23px;line-height:1.15;letter-spacing:-.5px;margin:0 0 6px}p{margin:0}.intro,.small{color:var(--muted);font-size:11px}.intro{margin-bottom:14px}.grid{margin-bottom:12px}.stat{flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:13px}.stat b{display:block;font-size:27px;line-height:1.2}.stat span{font-size:11px;color:var(--muted)}.primary{background:var(--accent);color:var(--on);font-weight:600}.wide{display:block;width:100%;margin-top:10px}.card{background:var(--soft);padding:6px 12px;border-radius:13px;margin-top:10px}.row{min-height:44px}.row+.row{border-top:1px solid var(--line)}.grow{flex:1;min-width:0}.title{font-size:12px;font-weight:600}.value{font-size:11px;white-space:nowrap}.toggle{padding:6px 9px;font-size:11px;background:var(--bg)}.toggle.on{background:var(--accent);color:var(--on)}.empty{text-align:center;padding:20px 10px;background:var(--soft);border-radius:13px}.empty strong{display:block;margin-bottom:6px}.chat{display:flex;align-items:center;gap:9px;width:100%;margin-bottom:8px;text-align:left}.chat .title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pager{margin-top:10px}.pager button{padding:7px 12px}.pager span{flex:1;text-align:center;font-size:11px}nav{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);gap:3px}nav button{flex:1;min-width:0;padding:8px 1px;font-size:10px;color:var(--muted);background:transparent}nav button.active{background:var(--soft);color:var(--ink)}nav i{display:block;font-size:18px;line-height:20px;font-style:normal;margin-bottom:3px}.foot{justify-content:space-between;margin-top:7px;padding-bottom:env(safe-area-inset-bottom,0px);font-size:9px;color:var(--muted)}.foot button{background:transparent;color:var(--muted);padding:4px;font-size:10px}#notice{font-size:11px;color:var(--muted);margin-top:8px;min-height:15px;overflow-wrap:anywhere}#notice.error{color:var(--bad)}.danger{background:var(--bad);color:var(--on)}@media(max-width:260px){body{padding:12px 10px}header{gap:6px}.mark{padding:4px 8px}.brand{font-size:10px}h1{font-size:20px}.stat{padding:10px}.stat b{font-size:23px}.card{padding:5px 9px}.row{gap:5px}nav button{font-size:9px}}
</style></head><body>
<header><span class="mark">G</span><span class="brand">GGSEL SELLER</span><span class="pill" id="badge"></span></header>
<main id="content"></main><p id="notice" role="status"></p><nav id="tabs"></nav>
<div class="foot"><span id="time"></span><button id="refresh">↻ Обновить</button></div>
<script>
(function(){
var W=window.TelegramWidget,S={},busy=false;
function $(id){return document.getElementById(id)}
function el(tag,cls,text){var n=document.createElement(tag);n.className=cls||'';if(text!==undefined)n.textContent=String(text);return n}
function add(parent,tag,cls,text){var n=el(tag,cls,text);parent.appendChild(n);return n}
function count(v){return Number.isFinite(Number(v))?Math.max(0,Math.floor(Number(v))):0}
function notice(text,error){$('notice').textContent=text||'';$('notice').className=error?'error':''}
function action(text,key,cls){var b=el('button',cls,text);b.onclick=function(){request(key)};return b}
function link(text,url,cls){var b=el('button',cls,text),valid=typeof url==='string'&&/^https:\/\/t\.me\/c\/[0-9]+\/[0-9]+$/.test(url)&&url.length<=256;b.dataset.unavailable=valid?'':'1';b.onclick=function(){if(W&&valid)W.openTelegramLink(url)};return b}
function setBusy(){document.querySelectorAll('button').forEach(function(b){b.disabled=!!(b.dataset.unavailable||busy||(S.busy&&b.id!=='refresh'))})}
function request(key){if(busy)return;if(!W){notice('Откройте /menu в Telegram');return}busy=true;notice('Обновляем…');setBusy();try{W.request(key).then(function(answer){busy=false;var data;try{data=JSON.parse(answer.result||'null')}catch(e){}if(data&&data.v===1)render(data);else{setBusy();notice(data&&data.error||'Не удалось обновить. Повторите попытку.',true)}},function(e){busy=false;setBusy();notice(e&&e.code==='RATE_LIMITED'?'Подождите несколько секунд':e&&e.code==='NOT_ALLOWED'?'Откройте /menu в личном чате':'Не удалось обновить. Повторите попытку.',true)})}catch(e){busy=false;setBusy();notice('Не удалось отправить запрос',true)}}
function head(title,sub){var n=$('content');add(n,'h1','',title);add(n,'p','intro',sub);return n}
function stat(parent,value,label){var d=add(parent,'div','stat');add(d,'b','',count(value));add(d,'span','',label)}
function row(parent,title,sub,value){var r=add(parent,'div','row'),g=add(r,'div','grow');add(g,'div','title',title);if(sub)add(g,'div','small',sub);if(value&&value.nodeType)r.appendChild(value);else add(r,'span','value',value)}
function home(){var n=head('Всё под контролем','Чаты и настройки магазина'),g=add(n,'div','grid');stat(g,S.chats,'переписок');stat(g,S.queue,'в очереди');n.appendChild(action('Перейти к покупателям →','view:chats:0','primary wide'));var c=add(n,'div','card');row(c,'Уведомления','Сообщения покупателей',S.notify?'Вкл.':'Выкл.');row(c,'Автоматизация','Команды · плагины',count(S.commands)+' · '+count(S.plugins))}
function chats(){var n=head('Переписки','Откройте тему для ответа покупателю'),items=Array.isArray(S.items)?S.items.slice(0,2):[];if(!items.length){var e=add(n,'div','empty');add(e,'strong','','Здесь появятся покупатели');add(e,'p','small','Бот создаст тему для нового диалога.')}items.forEach(function(item){var b=link('',item.url,'chat');add(b,'span','small','↗');var g=add(b,'div','grow');add(g,'div','title',String(item.name||'Покупатель').slice(0,70));add(g,'div','small','Диалог '+String(item.id||'').slice(0,20));n.appendChild(b)});var p=count(S.page),pages=Math.max(1,count(S.pages)),pg=add(n,'div','pager');var back=action('←','view:chats:'+Math.max(0,p-1));back.dataset.unavailable=p===0?'1':'';pg.appendChild(back);add(pg,'span','',String(p+1)+' / '+pages);var next=action('→','view:chats:'+Math.min(pages-1,p+1));next.dataset.unavailable=p>=pages-1?'1':'';pg.appendChild(next)}
function settings(){var n=head('Настройки','Обработка новых событий'),c=add(n,'div','card');var toggle=action(S.notify?'Вкл.':'Выкл.',S.notify?'notify:off':'notify:on','toggle'+(S.notify?' on':''));toggle.setAttribute('aria-label',S.notify?'Выключить уведомления':'Включить уведомления');row(c,'Уведомления','Сообщения в темах',toggle);row(c,'Команды','Настройка в группе',count(S.commands));row(c,'Плагины','Расширения команд',count(S.plugins));n.appendChild(action(S.sync?'Приостановить':'Возобновить',S.sync?'sync:pause':'sync:resume','wide'));n.appendChild(link('Рабочая группа ↗',S.group,'wide primary'))}
function status(){var n=head('Состояние','Последние проверки API · UTC'),c=add(n,'div','card'),checks=Array.isArray(S.checks)?S.checks:[];['Заказы','Поиск чатов','Сообщения'].forEach(function(t,i){row(c,t,'',String(checks[i]||'Ожидание').slice(0,25))});row(c,'Очередь','Доставка в Telegram',count(S.queue));add(n,'p','small wide',S.health==='ok'?'Есть успешные проверки API.':'Ожидаем проверку API.')}
function confirmation(){var n=head('Приостановить работу?','Новые события и ответы покупателям не будут обрабатываться до возобновления.');n.appendChild(action('Приостановить','confirm:'+S.confirm,'wide danger'));n.appendChild(action('Отмена','view:settings','wide'))}
var tabs=[['home','Обзор','⌂'],['chats','Чаты','☰'],['settings','Настройки','⚙'],['status','Статус','◷']];
function draw(){$('content').textContent='';$('badge').textContent=S.busy?'Обновление':S.sync?'● Работает':'Ⅱ Пауза';var view=tabs.some(function(t){return t[0]===S.view})?S.view:'home';if(S.confirm)confirmation();else ({home:home,chats:chats,settings:settings,status:status})[view]();var nav=$('tabs');nav.textContent='';tabs.forEach(function(t){var b=action('','view:'+t[0]+(t[0]==='chats'?':0':''),view===t[0]?'active':'');add(b,'i','',t[2]);add(b,'span','',t[1]);nav.appendChild(b)});$('time').textContent=S.updated?String(S.updated).slice(0,22):'Нет данных';setBusy()}
function render(data){S=data&&data.v===1?data:{};draw();notice(S.notice||(S.busy?'Изменяем состояние…':''))}
function stateChanged(){try{render(JSON.parse(W.chatData||'{}'))}catch(e){notice('Не удалось прочитать данные',true)}}
$('refresh').onclick=function(){request('refresh')};if(W){W.onEvent('chatDataChanged',stateChanged);stateChanged();W.ready()}else render({});
})();
</script></body></html>
